name: mychat
description: MyChat instant messaging client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.1

  # Local storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Protobuf
  protobuf: ^3.1.0

  # UI
  cached_network_image: ^3.3.1
  image_picker: ^1.1.1
  file_picker: ^8.0.3
  audioplayers: ^6.0.0
  fluttertoast: ^8.2.5
  timeago: ^3.6.2
  uuid: ^4.4.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  # Crypto
  cryptography: ^2.7.0
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
