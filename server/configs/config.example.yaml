server:
  host: "0.0.0.0"
  port: 9090
  mode: "debug"  # debug / release

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "your_db_password"
  dbname: "mychat"
  sslmode: "disable"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

minio:
  endpoint: "localhost:9000"
  access_key: "your_minio_access_key"
  secret_key: "your_minio_secret"
  bucket: "mychat"
  use_ssl: false

nats:
  url: "nats://localhost:4222"

jwt:
  private_key_path: "configs/private.pem"
  public_key_path: "configs/public.pem"
  access_ttl: 7200       # 2 hours (seconds)
  refresh_ttl: 2592000   # 30 days (seconds)

websocket:
  max_message_size: 10485760  # 10MB
  ping_period: 30             # seconds
  pong_timeout: 60            # seconds
  write_timeout: 10           # seconds

log:
  level: "debug"    # debug / info / warn / error
  output: "stdout"  # stdout / file
  file_path: "logs/mychat.log"
